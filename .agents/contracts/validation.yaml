schema_version: 2
file: .agents/contracts/validation.yaml
product: The Maximal Template
status: active
purpose: Machine-readable validation and evidence rules for the implemented Maximal Template.

authority:
  type: machine_interpretation
  owner_is_final_authority: true
  human_sources:
    - context/docs/tech-requirements.md
    - context/docs/architecture.md
    - context/docs/auth.md
    - context/docs/design.md
    - context/specs
  may_override_human_sources: false

evidence_states:
  - executed
  - skipped
  - blocked
  - inferred

evidence_rules:
  unexecuted_check_may_be_reported_as_passed: false
  prior_revision_pass_is_current_revision_pass: false
  static_inspection_proves_runtime_behavior: false
  build_proves_authorization: false
  ui_visibility_proves_authorization: false
  ui_visibility_proves_rls: false
  code_presence_proves_live_provider_configuration: false
  inferred_evidence_must_be_labeled: true

repository_commands:
  format_check: pnpm format:check
  lint: pnpm lint
  typecheck: pnpm typecheck
  prisma_validate: pnpm prisma:validate
  build: pnpm build
  aggregate_validate: pnpm validate

aggregate_validate_contains:
  - pnpm format:check
  - pnpm lint
  - pnpm typecheck

aggregate_validate_contains_prisma_validate: false
aggregate_validate_contains_build: false

default_validation:
  working_directory: template
  strategy: narrowest_relevant_first
  broad_checks_only_when_relevant_or_requested: true
  do_not_invent_parallel_validation_system: true

architecture_checks:
  root_route:
    source: app/page.tsx
    must_be_inside_public_route_group: false

  public_group:
    source: app/(public)

  auth_group:
    source: app/(auth)

  setup_group:
    source: app/(setup)

  tenant:
    source: app/(tenant)
    authentication_required: true
    onboarding_completion_required: true
    gate_owner: app/(tenant)/layout.tsx
    anonymous_browsing_required: false

  proxy:
    source: proxy.ts
    clerk_middleware_present: true
    route_matcher_owns_full_tenant_authorization: false

  presentation:
    templates_first_class: true
    mandatory_single_import_chain: false
    block_local_state_allowed: true
    feature_direct_ui_import_allowed: true
    feature_template_import_allowed: true

  server_boundaries:
    reads: lib/fetchers
    mutation_entrypoints: lib/actions
    orchestration: lib/workflows
    database_runtime: lib/db
    authentication: lib/auth
    authorization: lib/authz
    integrations: lib/integrations

  database_runtime_expected:
    - lib/db/client.ts
    - lib/db/provider.ts
    - lib/db/tenant.ts
    - lib/db/selects
    - lib/db/dto
    - lib/db/transactions

  invoicing_urls:
    - /invoices
    - /expenses
  invoicing_url_segment_required: false

high_risk_boundaries:
  - authentication
  - authorization
  - tenant_scope
  - onboarding_admission
  - rls
  - webhooks
  - provider_reconciliation
  - billing
  - destructive_migrations
  - live_provider_mutation

provider_validation:
  installed_code_proves_configured: false
  env_name_match_required: true
  missing_optional_configuration_must_fail_narrowly: true
  live_provider_claim_requires_live_evidence: true

completion_requirements:
  - relevant_acceptance_criteria_mapped_to_evidence
  - no_unexecuted_check_reported_as_passed
  - remaining_failures_or_gaps_explicit
  - governance_does_not_require_code_change_without_owner_authority
  - current_owner_instruction_wins_on_conflict
